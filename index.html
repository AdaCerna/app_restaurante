<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App Restaurante — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #16213e; border: 1px solid #e94560; border-radius: 8px; padding: 2rem; width: 100%; max-width: 400px; }
    h2 { color: #e94560; text-align: center; margin-bottom: 1.5rem; }
    label { color: #a8a8b3; }
    input { background: #0f3460; border: 1px solid #e94560; color: #fff; }
    input:focus { background: #0f3460; color: #fff; border-color: #e94560; box-shadow: none; }
    .btn-login { background: #e94560; border: none; width: 100%; padding: .75rem; font-weight: bold; }
    .btn-login:hover { background: #c73652; }
  </style>
</head>
<body>
<div class="card">
  <h2>🍽️ App Sabores</h2>
  <p style="color:#a8a8b3;text-align:center;font-size:.85rem;">Ambiente: DEV</p>
  <div class="mb-3">
    <label class="form-label">Usuario</label>
    <input type="text" class="form-control" id="user" placeholder="admin"/>
  </div>
  <div class="mb-3">
    <label class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="pass" placeholder="••••••••"/>
  </div>
  <button class="btn btn-login text-white" onclick="login()">Ingresar</button>
  <div id="msg" class="mt-3 text-center"></div>
</div>
<script>
  function login() {
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;
    const users = { admin: 'admin123', chef: 'chef2024' };
    const msg = document.getElementById('msg');
    if (users[u] && users[u] === p) {
      msg.innerHTML = '<span style="color:#8e44ad">✅ Bienvenido, ' + u + '!</span>';
    } else {
      msg.innerHTML = '<span style="color:#e94560">❌ Usuario o contraseña incorrectos</span>';
    }
  }
  document.addEventListener('keydown', e => { if(e.key==='Enter') login(); });
</script>
</body>
</html>
